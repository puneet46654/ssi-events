# Release flow:
#   Puneet pushes to GitHub → webhook runs `sync` → MR "Frontend update from GitHub" into main
#   → MR pipeline tests and builds it (no deploy) → owner reviews and merges → main pipeline deploys.
# Hosting: CloudFront → Lambda (runs only while requests arrive; no always-on server) + S3 for static assets.
# AWS access is via OIDC (no stored keys); only main of this project can assume the deploy role.

variables:
  FRONTEND_REPO: https://github.com/puneet46654/ssimayaconnect.git
  FRONTEND_REF: main
  AWS_ROLE_ARN: arn:aws:iam::051826716001:role/ssi-events-gitlab-deploy
  AWS_DEFAULT_REGION: ap-south-1
  DISTRIBUTION_ID: E2YO5MY27AOEY1
  SITE_URL: https://events.ssistudios.com

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - sync
  - build
  - deploy

# Pull Puneet's latest code into a merge request. Runs from the GitHub webhook
# (pipeline trigger) or a schedule, or manually from "Run pipeline".
sync:
  stage: sync
  image: node:24-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - bash infra/sync-frontend.sh

build:
  stage: build
  image: node:24-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
    # lib/db.ts requires a URI at import time; the build never connects. The real one lives only on Lambda.
    MONGODB_URI: mongodb://build.invalid:27017/placeholder
  script:
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - cd site
    - npm ci --no-audit --no-fund
    - node ../infra/prepare-build.mjs
    - npm test
    - npx next build
    - cd ..
    - bash infra/package-lambda.sh site
  artifacts:
    paths:
      - dist
    expire_in: 1 week

deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  resource_group: production
  environment:
    name: production
    url: $SITE_URL
  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token AWS_ROLE_SESSION_NAME="gitlab-$CI_PIPELINE_ID"
    - bash infra/deploy.sh dist "$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID"
    - sleep 20
    - test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/events")" = 200
