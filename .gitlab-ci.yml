# Release flow:
#   Developer pushes a branch to this project → opens an MR into main
#   → MR pipeline tests and builds frontend + backend (no deploy) → owner reviews and merges
#   → main pipeline builds again and deploys both to production.
# Hosting: CloudFront → Lambda (frontend, backend) + DynamoDB + S3. Nothing runs between requests.
# AWS access is via OIDC (no stored keys); only main of this project can assume the deploy role.

variables:
  AWS_ROLE_ARN: arn:aws:iam::051826716001:role/ssi-events-gitlab-deploy
  AWS_DEFAULT_REGION: ap-south-1
  DISTRIBUTION_ID: E2YO5MY27AOEY1
  SITE_URL: https://events.ssistudios.com

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - build
  - deploy

.build-rules: &build-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"

backend:
  stage: build
  image: node:24-bookworm
  <<: *build-rules
  script:
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - cd backend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm test
    - cd ..
    - bash infra/package-backend.sh "$CI_COMMIT_SHORT_SHA"
  artifacts:
    paths:
      - dist/api.zip
    expire_in: 1 week

frontend:
  stage: build
  image: node:24-bookworm
  <<: *build-rules
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
    # Legacy: frontend/lib/db.ts still requires a URI at import time. The build never connects;
    # production /api/* is served by backend/. Remove once frontend/ no longer contains server code.
    MONGODB_URI: mongodb://build.invalid:27017/placeholder
  script:
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm test
    - npx next build
    - cd ..
    - bash infra/package-lambda.sh frontend
  artifacts:
    paths:
      - dist/web.zip
      - dist/static
    expire_in: 1 week

deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
  needs: [backend, frontend]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  resource_group: production
  environment:
    name: production
    url: $SITE_URL
  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token AWS_ROLE_SESSION_NAME="gitlab-$CI_PIPELINE_ID"
    - bash infra/deploy.sh dist "$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID"
    - sleep 20
    - test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")" = 200
    # The backend must report this commit and a reachable database.
    - curl -sf "$SITE_URL/api/health" | grep -q "\"release\":\"$CI_COMMIT_SHORT_SHA\".*\"status\":\"ACTIVE\""
